name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]            # 打 tag 时同时发布 Release
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write           # 发布 Release 需要写权限

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Build EXE
        run: pyinstaller --onefile --collect-data pdfminer --name 发票提取 extract_invoices.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 发票提取-windows
          path: dist/发票提取.exe

      # 打 tag（如 v1.0.0）时发布 Release，提供免登录的 exe 直链
      # Release 资产名不支持中文（会被改成 default.exe），需用 ASCII 文件名
      - name: Rename EXE for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Copy-Item "dist/发票提取.exe" "dist/invoice2excel.exe"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/invoice2excel.exe
