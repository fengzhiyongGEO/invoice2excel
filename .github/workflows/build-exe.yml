name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:        # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller pdfplumber openpyxl

      - name: Build EXE
        run: pyinstaller --onefile --collect-data pdfminer --name 发票提取 extract_invoices.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 发票提取-windows
          path: dist/发票提取.exe
